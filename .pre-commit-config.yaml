# .pre-commit-config.yaml for python_rap_demo RAP project
#
# This file configures pre-commit hooks, which automatically check and fix code before you commit changes to Git.
# Pre-commit hooks help maintain code quality, and security by running checks
# (like formatting, linting, and secret detection) every time you make a commit.
#
# To use this file:
# 1. Install pre-commit: `pip install pre-commit`
# 2. Run `pre-commit install` in your project root to activate hooks.
# 3. When you commit, the hooks below will run automatically.
#
# Each section below sets up a different tool or check. Comments explain what each hook does.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Prevents accidentally committing very large files
      - id: check-added-large-files
        name: Check for files larger than 5 MB
        args: [ "--maxkb=5120" ]
        exclude: ^docs/user_guide/user_documentation\.md$
      # Ensures every file ends with a blank line (good for compatibility)
      - id: end-of-file-fixer
        name: Check for a blank line at the end of scripts (auto-fixes)
        exclude: '\.Rd|^docs/user_guide/user_documentation\.md$'
      # Removes extra spaces at the end of lines
      - id: trailing-whitespace
        name: Check for trailing whitespaces (auto-fixes)
        exclude: ^docs/user_guide/user_documentation\.md$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      # Cleans Jupyter notebooks by removing output cells before commit
      - id: nbstripout
        name: nbstripout - Strip outputs from notebooks (auto-fixes)
        args:
          - --extra-keys
          - "metadata.colab metadata.kernelspec cell.metadata.colab cell.metadata.executionInfo cell.metadata.id cell.metadata.outputId"
        exclude: ^docs/user_guide/user_documentation\.md$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      # Automatically sorts Python import statements for consistency
      - id: isort
        name: isort - Sort python imports (auto-fixes)
        args: [ "--profile", "black", "--filter-files" ]

  - repo: https://github.com/psf/black
    rev: 24.8.0 # Replace by any tag/version: https://github.com/psf/black/tags
    hooks:
      # Formats Python code to a consistent style
      - id: black
        args: ['--line-length=100']  # Optional if you have configured pyproject.toml
        name: black - consistent Python code formatting (auto-fixes)
        language_version: python # Should be a command that runs python3.6+
        exclude: ^(tests/|notebooks/)|^docs/user_guide/user_documentation\.md$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      # Checks for Python code errors and style issues
      - id: flake8
        name: flake8 - Python linting
        exclude: ^tests/|^docs/user_guide/user_documentation\.md$

  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.8.7
    hooks:
      # Sorts imports in Jupyter notebooks
      - id: nbqa-isort
        name: nbqa-isort - Sort Python imports (notebooks; auto-fixes)
        additional_dependencies: [ isort==5.8.0 ]
        exclude: ^docs/user_guide/user_documentation\.md$
      # Formats code in Jupyter notebooks
      - id: nbqa-black
        name: nbqa-black - consistent Python code formatting (notebooks; auto-fixes)
        additional_dependencies: [ black==24.3.0 ]
        exclude: ^docs/user_guide/user_documentation\.md$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      # Scans for accidentally committed secrets (like passwords or API keys)
      - id: detect-secrets
        name: detect-secrets - Detect secrets in staged code
        args: [ "--baseline", ".secrets.baseline" ]
        exclude: .*/tests/.*|^\.cruft\.json$|^docs/user_guide/user_documentation\.md$

  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.9'
    hooks:
      # Checks for security issues in Python code
      - id: bandit
        name: bandit - Checks for vulnerabilities
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^docs/user_guide/user_documentation\.md$

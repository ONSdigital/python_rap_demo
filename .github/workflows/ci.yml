# This is a GitHub Actions workflow file for Continuous Integration (CI).
# CI automatically checks your code for errors and runs tests every time you push changes
# or open a pull request to the main branch. This helps keep your code reproducible and reliable.
#
# What this file does:
# - Runs on every push or pull request to the main branch
# - Sets up a fresh Python environment
# - Installs your project's dependencies
# - Runs all unit tests in the 'tests/' folder
#
# Each step is explained below for beginners.

name: CI

on:
  # Run this workflow when you push to 'main' or open a pull request to 'main'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Use the latest Ubuntu operating system for the runner
    runs-on: ubuntu-latest  # This is a virtual machine provided by GitHub
    steps:
      # Step 1: Download your repository code onto the runner
      - uses: actions/checkout@v4
      # Step 2: Set up Python version 3.11 on the runner
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Step 3: Install all required Python packages listed in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  # Upgrade pip to the latest version
          pip install -r requirements.txt      # Install all dependencies
      # Step 4: Run all unit tests in the 'tests/' folder
      - name: Run tests
        run: |
          python -m unittest discover tests   # Run all tests using Python's unittest
          # You can replace this with 'pytest tests' if you prefer pytest

# If any step fails, the workflow will stop and show an error in GitHub.
# This helps you catch problems early.
